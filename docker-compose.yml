# ReferralPlatform — local development stack.
#
# See root CONVENTIONS.md ("How services call each other", "Environment variable
# conventions") and README.md ("How to run this locally") before changing this file.
#
# Database convention: ONE shared PostgreSQL instance, ONE schema per service
# (see CONVENTIONS.md, "Database access / ORM" for why — not one database per
# microservice). Each service's DATABASE_URL below points at the same `postgres`
# container with a distinct `?schema=` query param.
#
# Port map (host:container) — every port a human needs to hit from outside Docker.
# Host side deliberately uses a clean sequential 20000+ range (Carl's request,
# 2026-08-14) so nothing here can collide with whatever's already using the
# "normal" default ports (5432, 6379, 3000-range, etc.) on a dev machine.
# Container-internal ports are untouched — inter-service traffic on the Docker
# network still uses each service's normal default port via its DNS name
# (e.g. postgres:5432, audit-log:3012), only the HOST-exposed side changed.
#   20000 postgres            (psql / GUI client)
#   20001 redis
#   20002 immudb (gRPC)       20003 immudb (metrics)
#   20004 keycloak admin/OIDC
#   20005 mailhog (SMTP)      20006 mailhog (web UI — view OTP/account-activation emails here)
#   20007 identity-access     20008 onboarding-account   20009 gp-authorisation
#   20010 consent-security    20011 referral             20012 directory
#   20013 booking             20014 specialist-review    20015 followup-recall
#   20016 notification        20017 admin-console         20018 audit-log
#   20019 fhir-gateway (Java/Spring Boot — see services/fhir-gateway/README.md)
#   20020 gp-portal           20021 specialist-portal    20022 patient-web
#   20023 patient-mobile (Metro bundler)  20024 patient-mobile (Expo dev tools)
#
# Every Node service Dockerfile expects the MONOREPO ROOT as its build context
# (it needs packages/shared-types, packages/audit-client, packages/auth-client) —
# see each service's Dockerfile. fhir-gateway is the one exception: its own
# directory is a self-contained Maven module.

x-node-service-env: &node-service-env
  NODE_ENV: development
  REDIS_URL: redis://redis:6379
  KEYCLOAK_ISSUER: http://keycloak:8080/realms/referralplatform
  AUDIT_LOG_SERVICE_URL: http://audit-log:3012

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  # ---------------------------------------------------------------------------
  # Shared infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: referralplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: referralplatform
      POSTGRES_PASSWORD: referralplatform
      POSTGRES_DB: referralplatform
    ports:
      - '20000:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD-SHELL', 'pg_isready -U referralplatform']

  redis:
    image: redis:7-alpine
    container_name: referralplatform-redis
    restart: unless-stopped
    ports:
      - '20001:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'redis-cli', 'ping']

  immudb:
    image: codenotary/immudb:1.9.5
    container_name: referralplatform-immudb
    restart: unless-stopped
    environment:
      IMMUDB_ADMIN_PASSWORD: change-me-in-local-env
    ports:
      - '20002:3322' # gRPC — the Audit Log Service connects here (see services/audit-log/.env.example)
      - '20003:9497' # Prometheus metrics
    volumes:
      - immudb-data:/var/lib/immudb
    healthcheck:
      # codenotary/immudb ships no shell and no network tools (nc/curl/wget) at
      # all, so a true readiness probe isn't available — `nc -z` here always
      # failed regardless of immudb's actual state. Falls back to "the
      # binary can still execute" as a liveness signal.
      <<: *healthcheck-defaults
      test: ['CMD', '/usr/sbin/immudb', 'version']

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: referralplatform-keycloak
    command: ['start-dev', '--import-realm']
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: change-me-in-local-env
      KC_DB: dev-file
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '20004:8080' # OIDC issuer for local dev: http://localhost:20004/realms/referralplatform
    volumes:
      # Realm import — GP/specialist/patient/carer/internal-staff clients and the
      # carer-vs-patient / OTP custom auth flow get defined here as the platform
      # is built out. See infra/keycloak/README.md.
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 40s
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/localhost/9000 && echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "UP" <&3',
        ]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: referralplatform-mailhog
    restart: unless-stopped
    ports:
      - '20005:1025' # SMTP — every service's local email (incl. OTP/account-activation) sends here
      - '20006:8025' # Web UI — http://localhost:20006 to read OTP emails during local dev/testing

  # ---------------------------------------------------------------------------
  # Services (services/*) — see root CONVENTIONS.md for the shared Dockerfile
  # pattern. Real business logic now exists in every service (see each
  # BUILD_LOG/<service>.md for what's real vs. MOCK-labelled); every external
  # government/vendor integration (HI Service, AHPRA, NASH, MHR, NHSD
  # Directory, HealthPathways, HealthLink/Medical-Objects, SMS) is a clearly
  # labelled mock behind a real interface, since no sandbox credentials exist
  # for any of them in this build.
  # ---------------------------------------------------------------------------

  identity-access:
    build: { context: ., dockerfile: services/identity-access/Dockerfile }
    container_name: referralplatform-identity-access
    ports: ['20007:3001']
    environment:
      <<: *node-service-env
      PORT: 3001
      DATABASE_URL: postgresql://referralplatform:referralplatform@postgres:5432/referralplatform?schema=identity_access
      KEYCLOAK_CLIENT_ID: identity-access-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
      ACCOUNT_LINK_ALLOWED_ORIGINS: http://localhost:20020,http://localhost:20021,http://localhost:20022,http://localhost:20023
      STEP_UP_ACR: passkey
      # MOCK myID (TDIF) relying-party stub — see services/identity-access/src/mock-myid.
      # Must be the address Keycloak's container can reach, not "localhost".
      MOCK_MYID_CLIENT_ID: referralplatform-myid-stub
      MOCK_MYID_CLIENT_SECRET: change-me-in-local-env
      MOCK_MYID_ISSUER_BASE_URL: http://identity-access:3001/mock-myid
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  onboarding-account:
    build: { context: ., dockerfile: services/onboarding-account/Dockerfile }
    container_name: referralplatform-onboarding-account
    ports: ['20008:3002']
    environment:
      <<: *node-service-env
      PORT: 3002
      DATABASE_URL: postgresql://referralplatform:referralplatform@postgres:5432/referralplatform?schema=onboarding_account
      KEYCLOAK_CLIENT_ID: onboarding-account-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_FROM: no-reply@referralplatform.example.au
      OTP_HASH_SECRET: change-me-in-local-env
      # Activation link is opened in the patient's own browser, outside the compose
      # network — must be the host-published patient-web port, not the internal
      # "patient-web" hostname.
      ACTIVATION_LINK_BASE_URL: http://localhost:20022/activate
      DIRECTORY_SERVICE_URL: http://directory:3006
      IDENTITY_ACCESS_SERVICE_URL: http://identity-access:3001
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      mailhog: { condition: service_started }
      identity-access: { condition: service_started }
      directory: { condition: service_started }

  gp-authorisation:
    build: { context: ., dockerfile: services/gp-authorisation/Dockerfile }
    container_name: referralplatform-gp-authorisation
    ports: ['20009:3003']
    environment:
      <<: *node-service-env
      PORT: 3003
      DATABASE_URL: postgresql://referralplatform:referralplatform@postgres:5432/referralplatform?schema=gp_authorisation
      KEYCLOAK_CLIENT_ID: gp-authorisation-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
      STEP_UP_ACR: passkey
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  consent-security:
    build: { context: ., dockerfile: services/consent-security/Dockerfile }
    container_name: referralplatform-consent-security
    ports: ['20010:3004']
    environment:
      <<: *node-service-env
      PORT: 3004
      DATABASE_URL: postgresql://referralplatform:referralplatform@postgres:5432/referralplatform?schema=consent_security
      KEYCLOAK_CLIENT_ID: consent-security-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
      GP_AUTHORISATION_SERVICE_URL: http://gp-authorisation:3003
      STEP_UP_ACR: passkey
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      gp-authorisation: { condition: service_started }

  referral:
    build: { context: ., dockerfile: services/referral/Dockerfile }
    container_name: referralplatform-referral
    ports: ['20011:3005']
    environment:
      <<: *node-service-env
      PORT: 3005
      DATABASE_URL: postgresql://referralplatform:referralplatform@postgres:5432/referralplatform?schema=referral
      KEYCLOAK_CLIENT_ID: referral-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
      GP_AUTHORISATION_SERVICE_URL: http://gp-authorisation:3003
      GP_AUTHORISATION_FAIL_OPEN: 'false'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      audit-log: { condition: service_started }
      gp-authorisation: { condition: service_started }

  directory:
    build: { context: ., dockerfile: services/directory/Dockerfile }
    container_name: referralplatform-directory
    ports: ['20012:3006']
    environment:
      <<: *node-service-env
      PORT: 3006
      DATABASE_URL: postgresql://referralplatform:referralplatform@postgres:5432/referralplatform?schema=directory
      KEYCLOAK_CLIENT_ID: directory-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
      # HealthPathways/HealthLink/Medical-Objects/Direct-Delivery are all MOCK
      # clients in this build (see BUILD_LOG/directory.md) — values below match
      # each mock's documented default.
      HEALTHPATHWAYS_UNAVAILABLE_PHNS: ''
      SECURE_MESSAGING_DEFAULT_VENDOR: healthlink
      HEALTHLINK_MOCK_FAILURE_RATE: '0'
      MEDICAL_OBJECTS_MOCK_FAILURE_RATE: '0'
      DIRECT_DELIVERY_MOCK_FAILURE_RATE: '0'
      NOTIFICATION_SERVICE_URL: http://notification:3010
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      audit-log: { condition: service_started }
      notification: { condition: service_started }

  booking:
    build: { context: ., dockerfile: services/booking/Dockerfile }
    container_name: referralplatform-booking
    ports: ['20013:3007']
    environment:
      <<: *node-service-env
      PORT: 3007
      DATABASE_URL: postgresql://referralplatform:referralplatform@postgres:5432/referralplatform?schema=booking
      KEYCLOAK_CLIENT_ID: booking-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
      REFERRAL_SERVICE_URL: http://referral:3005
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      audit-log: { condition: service_started }
      referral: { condition: service_started }

  specialist-review:
    build: { context: ., dockerfile: services/specialist-review/Dockerfile }
    container_name: referralplatform-specialist-review
    ports: ['20014:3008']
    environment:
      <<: *node-service-env
      PORT: 3008
      DATABASE_URL: postgresql://referralplatform:referralplatform@postgres:5432/referralplatform?schema=specialist_review
      KEYCLOAK_CLIENT_ID: specialist-review-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
      FHIR_GATEWAY_URL: http://fhir-gateway:3013
      REFERRAL_SERVICE_URL: http://referral:3005
      # rule_based needs no external API; llm needs LLM_API_KEY/LLM_API_URL, which
      # this build has no credentials for (see BUILD_LOG/specialist-review.md).
      EXTRACTION_PROVIDER: rule_based
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      referral: { condition: service_started }
      fhir-gateway: { condition: service_started }

  followup-recall:
    build: { context: ., dockerfile: services/followup-recall/Dockerfile }
    container_name: referralplatform-followup-recall
    ports: ['20015:3009']
    environment:
      <<: *node-service-env
      PORT: 3009
      DATABASE_URL: postgresql://referralplatform:referralplatform@postgres:5432/referralplatform?schema=followup_recall
      KEYCLOAK_CLIENT_ID: followup-recall-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
      CONSENT_SECURITY_SERVICE_URL: http://consent-security:3004
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      consent-security: { condition: service_started }

  notification:
    build: { context: ., dockerfile: services/notification/Dockerfile }
    container_name: referralplatform-notification
    ports: ['20016:3010']
    environment:
      <<: *node-service-env
      PORT: 3010
      DATABASE_URL: postgresql://referralplatform:referralplatform@postgres:5432/referralplatform?schema=notification
      KEYCLOAK_CLIENT_ID: notification-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
      # SMS provider is mocked for local dev (no paid account) — real OTP/account
      # activation email goes through mailhog instead. See modules-and-requirements.md.
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_FROM: no-reply@referralplatform.example.au
      SMS_PROVIDER: mock
      PUSH_PROVIDER: mock
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      mailhog: { condition: service_started }

  admin-console:
    build: { context: ., dockerfile: services/admin-console/Dockerfile }
    container_name: referralplatform-admin-console
    ports: ['20017:3011']
    environment:
      <<: *node-service-env
      PORT: 3011
      DATABASE_URL: postgresql://referralplatform:referralplatform@postgres:5432/referralplatform?schema=admin_console
      KEYCLOAK_CLIENT_ID: admin-console-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
      ONBOARDING_ACCOUNT_SERVICE_URL: http://onboarding-account:3002
      CONSENT_SECURITY_SERVICE_URL: http://consent-security:3004
      STEP_UP_ACR: passkey
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      audit-log: { condition: service_started }
      onboarding-account: { condition: service_started }
      consent-security: { condition: service_started }

  audit-log:
    build: { context: ., dockerfile: services/audit-log/Dockerfile }
    container_name: referralplatform-audit-log
    ports: ['20018:3012']
    environment:
      NODE_ENV: development
      PORT: 3012
      REDIS_URL: redis://redis:6379
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/referralplatform
      KEYCLOAK_CLIENT_ID: audit-log-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
      DATABASE_URL: postgresql://referralplatform:referralplatform@postgres:5432/referralplatform?schema=audit_log
      IMMUDB_ADDRESS: immudb:3322
      IMMUDB_USERNAME: immudb
      IMMUDB_PASSWORD: change-me-in-local-env
      IMMUDB_DATABASE: audit_log
      # NOTE: previously pointed at /run/secrets/local-dev-only-nash-key.pem, but
      # this compose file defines no `secrets:` for this service, so that path
      # doesn't exist and isn't writable — MockNashSigner's first-run keygen would
      # fail (exactly the risk BUILD_LOG/audit-log.md flagged). Point both MOCK
      # key materials at a dedicated named volume instead, so the mock KMS
      # "erasure" state and the mock NASH keypair both survive a container
      # recreate (`docker compose down` without `-v`).
      NASH_SIGNING_KEY_PATH: /keys/local-dev-only-nash-key.pem
      KMS_MOCK_KEYSTORE_PATH: /keys/local-dev-only-kms-keystore.json
    volumes:
      - audit-log-keys:/keys
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      immudb: { condition: service_healthy }

  fhir-gateway:
    # Self-contained Maven module — build context is its own directory, not the
    # monorepo root. See services/fhir-gateway/README.md.
    build: { context: services/fhir-gateway, dockerfile: Dockerfile }
    container_name: referralplatform-fhir-gateway
    ports: ['20019:3013']
    environment:
      HI_SERVICE_BASE_URL: https://hi-service.example.gov.au
      HI_SERVICE_MODE: block
      # See services/audit-log's equivalent fix above — /run/secrets isn't mounted
      # in this compose file, so a writable in-container path is used instead.
      NASH_SIGNING_KEY_PATH: /app/keys/local-dev-only-nash-key.pem
      NASH_MODE: block
      MHR_BASE_URL: https://mhr.example.gov.au
      MHR_MODE: block
      # Previously missing entirely — every other service gets these via the
      # node-service-env anchor, but that's Node-specific so this Spring Boot
      # service needs them spelled out. Values match infra/keycloak/realm-export.json's
      # (now-added) fhir-gateway-service client — see BUILD_LOG/fhir-gateway.md.
      AUDIT_LOG_SERVICE_URL: http://audit-log:3012
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/referralplatform
      KEYCLOAK_CLIENT_ID: fhir-gateway-service
      KEYCLOAK_CLIENT_SECRET: change-me-in-local-env
    volumes:
      - fhir-gateway-keys:/app/keys
    depends_on:
      keycloak: { condition: service_healthy }
      audit-log: { condition: service_started }

  # ---------------------------------------------------------------------------
  # Apps (apps/*) — the three Next.js web surfaces + the Expo patient-mobile app.
  # ---------------------------------------------------------------------------

  gp-portal:
    build: { context: ., dockerfile: apps/gp-portal/Dockerfile }
    container_name: referralplatform-gp-portal
    ports: ['20020:3100']
    environment:
      NODE_ENV: development
      # NOTE (see BUILD_LOG/gp-portal.md): these NEXT_PUBLIC_* values are read by
      # the *browser*, which runs on the host, not inside the compose network —
      # they must stay as published host ports (http://localhost:<port>), never
      # the internal service hostnames. They're also only actually baked into the
      # client bundle if apps/gp-portal/Dockerfile's build stage sees them (it
      # currently doesn't pass build args — see known gaps in the final report);
      # every app's own lib/api/config.ts already falls back to these same
      # localhost defaults, so this block is set for explicitness/completeness
      # per this pass's brief, not because the app was broken without it.
      NEXT_PUBLIC_IDENTITY_ACCESS_URL: http://localhost:20007
      NEXT_PUBLIC_ONBOARDING_ACCOUNT_URL: http://localhost:20008
      NEXT_PUBLIC_GP_AUTHORISATION_URL: http://localhost:20009
      NEXT_PUBLIC_CONSENT_SECURITY_URL: http://localhost:20010
      NEXT_PUBLIC_REFERRAL_SERVICE_URL: http://localhost:20011
      NEXT_PUBLIC_DIRECTORY_SERVICE_URL: http://localhost:20012
      NEXT_PUBLIC_FOLLOWUP_RECALL_URL: http://localhost:20015
      NEXT_PUBLIC_NOTIFICATION_SERVICE_URL: http://localhost:20016
      NEXT_PUBLIC_KEYCLOAK_ISSUER: http://localhost:20004/realms/referralplatform
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: gp-portal
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:20020
    depends_on:
      - identity-access
      - onboarding-account
      - gp-authorisation
      - consent-security
      - referral
      - directory
      - followup-recall
      - notification

  specialist-portal:
    build: { context: ., dockerfile: apps/specialist-portal/Dockerfile }
    container_name: referralplatform-specialist-portal
    ports: ['20021:3101']
    environment:
      NODE_ENV: development
      # See gp-portal's equivalent block above for why these are localhost, not
      # the internal service hostnames.
      NEXT_PUBLIC_IDENTITY_ACCESS_URL: http://localhost:20007
      NEXT_PUBLIC_REFERRAL_SERVICE_URL: http://localhost:20011
      NEXT_PUBLIC_DIRECTORY_SERVICE_URL: http://localhost:20012
      NEXT_PUBLIC_SPECIALIST_REVIEW_URL: http://localhost:20014
      NEXT_PUBLIC_BOOKING_SERVICE_URL: http://localhost:20013
      NEXT_PUBLIC_FOLLOWUP_RECALL_URL: http://localhost:20015
      NEXT_PUBLIC_KEYCLOAK_ISSUER: http://localhost:20004/realms/referralplatform
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: specialist-portal
    depends_on:
      - identity-access
      - specialist-review
      - booking
      - directory
      - referral
      - followup-recall

  patient-web:
    build: { context: ., dockerfile: apps/patient-web/Dockerfile }
    container_name: referralplatform-patient-web
    ports: ['20022:3102']
    environment:
      NODE_ENV: development
      # See gp-portal's equivalent block above for why these are localhost, not
      # the internal service hostnames.
      NEXT_PUBLIC_IDENTITY_ACCESS_URL: http://localhost:20007
      NEXT_PUBLIC_ONBOARDING_ACCOUNT_URL: http://localhost:20008
      NEXT_PUBLIC_GP_AUTHORISATION_URL: http://localhost:20009
      NEXT_PUBLIC_CONSENT_SECURITY_URL: http://localhost:20010
      NEXT_PUBLIC_REFERRAL_SERVICE_URL: http://localhost:20011
      NEXT_PUBLIC_DIRECTORY_SERVICE_URL: http://localhost:20012
      NEXT_PUBLIC_BOOKING_SERVICE_URL: http://localhost:20013
      NEXT_PUBLIC_FOLLOWUP_RECALL_URL: http://localhost:20015
      NEXT_PUBLIC_NOTIFICATION_SERVICE_URL: http://localhost:20016
      NEXT_PUBLIC_KEYCLOAK_ISSUER: http://localhost:20004/realms/referralplatform
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: patient-web
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:20022
    depends_on:
      - identity-access
      - onboarding-account
      - gp-authorisation
      - consent-security
      - referral
      - directory
      - booking
      - followup-recall
      - notification

  patient-mobile:
    # Expo/React Native has no meaningful production Docker image (it ships to
    # app stores, not a container) — this entry runs the Metro dev server only,
    # so `docker compose up patient-mobile` gives a consistent way to start it
    # alongside the rest of the stack. See apps/patient-mobile/README.md for the
    # normal (non-Docker) local workflow, which is usually more convenient for
    # actually developing against a simulator/device.
    image: node:20-alpine
    container_name: referralplatform-patient-mobile
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - '20023:8081' # Metro bundler
      - '20024:19000' # Expo dev tools
    environment:
      EXPO_PUBLIC_IDENTITY_ACCESS_URL: http://localhost:20007
      EXPO_PUBLIC_ONBOARDING_ACCOUNT_SERVICE_URL: http://localhost:20008
      EXPO_PUBLIC_GP_AUTHORISATION_URL: http://localhost:20009
